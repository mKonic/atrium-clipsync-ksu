name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        run: ./build.sh test
      - name: Build
        run: ./build.sh
      - name: Update manifest
        run: |
          cat > build/update.json <<JSON
          {
            "version": "$(scripts/version.sh name)",
            "versionCode": $(scripts/version.sh code),
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$(scripts/version.sh name)/atrium-clipsync.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/$(scripts/version.sh name)"
          }
          JSON
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/atrium-clipsync.zip build/update.json --title "${GITHUB_REF_NAME}" --generate-notes
